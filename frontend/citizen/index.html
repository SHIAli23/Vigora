<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070708">
  <title>Vigora — Граждани</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/shared/vigora.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-app="citizen">

  <!-- Login and registration -->
  <main id="login-screen" class="login-page hidden">
    <div class="login-card">
      <div class="wordmark">Vig<em>o</em>ra</div>
      <p class="app-name">Граждани</p>

      <form id="login-form" novalidate>
        <div class="field hidden" id="full-name-field">
          <label for="full_name">Име и фамилия</label>
          <input id="full_name" name="full_name" autocomplete="name" maxlength="100">
        </div>
        <div class="field">
          <label for="username">Потребителско име</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none"
                 spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">Парола</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="error-text hidden" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Вход</button>
      </form>

      <button type="button" class="btn btn-quiet btn-block mode-toggle" id="mode-toggle">
        Нямате акаунт? Регистрация
      </button>

      <div class="demo-accounts" id="demo-accounts">
        <p class="hint">Демо акаунти. Отворете различни раздели за различни хора.</p>
        <div class="demo-list">
          <button type="button" data-demo-user="citizen1" data-demo-pass="citizen123">Иван</button>
          <button type="button" data-demo-user="citizen2" data-demo-pass="citizen123">Мария</button>
          <button type="button" data-demo-user="citizen3" data-demo-pass="citizen123">Георги</button>
          <button type="button" data-demo-user="citizen4" data-demo-pass="citizen123">Елена</button>
          <button type="button" data-demo-user="citizen5" data-demo-pass="citizen123">Николай</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Home after login -->
  <div id="app-screen" class="hidden">
    <a class="call-bar" href="tel:112">
      <span>При опасност за живота се обадете</span>
      <span class="call-pill">112</span>
    </a>

    <div class="app-header-wrap">
      <header class="app-header">
        <span class="wordmark">Vig<em>o</em>ra</span>
        <span class="header-right">
          <span id="conn" class="conn offline">Свързване…</span>
          <button type="button" class="btn btn-quiet" id="logout">Изход</button>
        </span>
      </header>
    </div>

    <main class="app-main">
      <h1 id="greeting" class="greeting">Какво се случва?</h1>
      <p class="hint">Изберете вида на сигнала. Ще го видят операторите на 112 веднага.</p>

      <div id="type-grid" class="type-grid" aria-label="Вид на сигнала"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/shared/vigora.js"></script>
  <script src="app.js"></script>
</body>
</html>
